site_name: LiZH0911的学习笔记
site_url: https://lizh0911.github.io/
repo_url: https://github.com/LiZH0911/LiZH0911.github.io
repo_name: LiZH0911.github.io
theme:
  name: material
  custom_dir: overrides
  language: zh
  features:
    - navigation.tabs
    - navigation.top
    # - navigation.expand
    - search.suggest
    - content.code.copy

  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式

  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/home.css
  - assets/about.css
  - assets/footer.css
  - assets/achievements.css

# 可选：让正文图片点击放大（先安装：pip install mkdocs-glightbox）
# plugins:
#   - glightbox

